<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DKP KERAJAAN 3909</title>
    <!-- CSS Bootstrap untuk Tampilan Rapi & Responsif -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Library PapaParse untuk membaca CSV Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-title { background: #1b2a47; color: #fff; padding: 20px 0; margin-bottom: 30px; text-align: center; }
        .table-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>DKP KERAJAAN 3909</h1>
        <p class="mb-0">Data Publikasi Real-Time Google Sheets</p>
    </div>

    <div class="container">
        <div class="table-container">
            <div id="loading" class="text-center my-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Memuat data terbaru...</p>
            </div>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover d-none" id="dkpTable">
                    <thead class="table-dark" id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Ganti URL di bawah ini dengan URL CSV yang didapat dari "Publikasikan ke Web"
        const csvUrl = 'PASTE_LINK_CSV_GOOGLE_SHEETS_DI_SINI';

        function loadData() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const tableHead = document.getElementById('tableHead');
                    const tableBody = document.getElementById('tableBody');
                    
                    if (data.length > 0) {
                        // Buat Header Tabel
                        let headHtml = '<tr>';
                        Object.keys(data[0]).forEach(key => {
                            headHtml += `<th>${key}</th>`;
                        });
                        headHtml += '</tr>';
                        tableHead.innerHTML = headHtml;

                        // Buat Isi Tabel
                        let bodyHtml = '';
                        data.forEach(row => {
                            // Abaikan baris kosong
                            if (Object.values(row).some(value => value !== '')) {
                                bodyHtml += '<tr>';
                                Object.values(row).forEach(val => {
                                    bodyHtml += `<td>${val}</td>`;
                                });
                                bodyHtml += '</tr>';
                            }
                        });
                        tableBody.innerHTML = bodyHtml;

                        // Tampilkan Tabel & Sembunyikan Loading
                        document.getElementById('loading').classList.add('d-none');
                        document.getElementById('dkpTable').classList.remove('d-none');
                    }
                }
            });
        }

        // Jalankan fungsi saat halaman dimuat
        window.onload = loadData;
    </script>
</body>
</html>
